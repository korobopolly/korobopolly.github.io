{{ define "main" }}
<div class="container list-page">
    <div class="page-header">
        <h1 class="page-title">시리즈</h1>
        <p class="page-description">주제별로 정리된 포스트 시리즈를 확인하세요</p>
    </div>

    <div class="series-grid">
        {{ range .Data.Terms.ByCount }}
        <a href="{{ .Page.RelPermalink }}" class="series-card">
            <h3 class="series-card-title">{{ .Page.Title }}</h3>
            <p class="series-card-count">{{ .Count }}개의 포스트</p>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
