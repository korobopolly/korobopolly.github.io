{{ $dateFormat := "2006년 01월 02일 15:04" }}
<div class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02T15:04" }}">{{ .Date.Format $dateFormat }}</time>
  <span class="meta-sep">&middot;</span>
  <span>예상 소요시간 {{ .ReadingTime }}분</span>
  {{ if .Params.tags }}
  <span class="meta-sep">&middot;</span>
  <div class="post-tags">
    {{ range .Params.tags }}
    <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}" class="tag">{{ . }}</a>
    {{ end }}
  </div>
  {{ end }}
</div>
