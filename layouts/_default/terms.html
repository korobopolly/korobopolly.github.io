{{ define "main" }}
<div class="container list-page">
    <div class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ with .Description }}
        <p class="page-description">{{ . }}</p>
        {{ end }}
    </div>

    <div class="terms-list">
        {{ range .Data.Terms.Alphabetical }}
        <a href="{{ .Page.RelPermalink }}" class="term-badge">
            {{ .Page.Title }} ({{ .Count }})
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
