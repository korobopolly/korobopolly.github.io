baseURL = "https://korobopolly.github.io/"
languageCode = "ko"
title = "Korobopolly's Dev Blog"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "AI 도구, Java, Spring Boot, React 등 실전 개발 기술을 다루는 블로그"
  author = "Korobopolly"
  github = "https://github.com/korobopolly"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    style = "catppuccin-mocha"
    lineNos = false
    noClasses = true
  [markup.goldmark.extensions]
    typographer = false
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[pagination]
  pagerSize = 10

enableRobotsTXT = true
enableEmoji = true
