<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJwiRs6NzoX32ZxXgUc5FtMdOPnxjTo8c",
            authDomain: "korobopolly.firebaseapp.com",
            projectId: "korobopolly",
            storageBucket: "korobopolly.appspot.com",
            messagingSenderId: "81066462526",
            appId: "1:81066462526:web:4faf6cf5f4ab8e1b60306f",
            measurementId: "G-XLRLPQ72X9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchData() {
            try {
                const docRef = doc(db, 'database', 'basedata');
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    console.log('Document found!');
                    localStorage.setItem("docSnap", JSON.stringify(docSnap.data()));
                } else {
                    console.log('No such document!');
                }
            } catch (error) {
                console.error('Error getting document:', error);
            }
        }

        fetchData();
    </script>
    
    <title>MapleStory 전적검색 | 메이플스토리 캐릭터 정보</title>
    <meta name="description" content="메이플스토리 캐릭터의 전적, 경험치, 레벨 정보를 검색하고 차트로 확인하세요">
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 dark:from-slate-900 dark:to-slate-800 min-h-screen transition-all duration-300">
    <!-- Dark mode toggle -->
    <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-105">
        <i data-lucide="sun" class="w-5 h-5 text-yellow-500 dark:hidden"></i>
        <i data-lucide="moon" class="w-5 h-5 text-blue-400 hidden dark:inline"></i>
    </button>

    <!-- Header -->
    <header class="text-center py-12 px-4 animate-fade-in">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center justify-center gap-3 mb-4">
                <div class="p-3 bg-gradient-to-r from-orange-400 to-red-500 rounded-2xl shadow-lg">
                    <i data-lucide="sword" class="w-8 h-8 text-white"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-orange-600 to-red-600 bg-clip-text text-transparent">
                    메이플스토리 전적검색
                </h1>
            </div>
            <p class="text-lg text-slate-600 dark:text-slate-300 max-w-2xl mx-auto">
                캐릭터의 경험치와 레벨 변화를 차트로 확인하고 상세한 정보를 확인하세요
            </p>
        </div>
    </header>

    <!-- Search Section -->
    <main class="max-w-6xl mx-auto px-4 pb-12">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-8 mb-8 animate-slide-up">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-center">
                <div class="relative w-full md:w-96">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                    </div>
                    <input
                        type="text"
                        id="x_SRCH"
                        placeholder="캐릭터명을 입력하세요"
                        class="w-full pl-12 pr-4 py-4 text-lg border-2 border-slate-200 dark:border-slate-600 rounded-2xl bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 dark:focus:border-blue-400 transition-all duration-300"
                    />
                </div>
                <button
                    id="fetchButton"
                    class="px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-semibold rounded-2xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                    disabled
                >
                    <span class="flex items-center gap-2">
                        <i data-lucide="database" class="w-5 h-5"></i>
                        조회
                    </span>
                </button>
            </div>
            
            <!-- Loading indicator -->
            <div id="loading" class="hidden mt-4 text-center">
                <div class="inline-flex items-center gap-3 px-4 py-2 bg-blue-50 dark:bg-blue-900/30 rounded-full text-blue-600 dark:text-blue-400">
                    <div class="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    데이터를 불러오는 중...
                </div>
            </div>
        </div>

        <!-- Character Info Section -->
        <div id="character-section" class="hidden animate-slide-up">
            <!-- Character Card -->
            <div id="character-card" class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-8 mb-8">
                <!-- Character info will be inserted here -->
            </div>

            <!-- Charts Section -->
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6">
                    <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i data-lucide="trending-up" class="w-6 h-6 text-green-500"></i>
                        경험치 히스토리
                    </h3>
                    <div class="relative h-80">
                        <canvas id="exp-chart"></canvas>
                    </div>
                </div>
                
                <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6">
                    <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-6 h-6 text-blue-500"></i>
                        레벨 히스토리
                    </h3>
                    <div class="relative h-80">
                        <canvas id="level-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 rounded-2xl p-6 text-center animate-fade-in">
            <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-3"></i>
            <p class="text-lg font-medium">캐릭터를 찾을 수 없습니다</p>
            <p class="text-sm mt-2 opacity-80">캐릭터명이 올바른지 확인해주세요</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 px-4 text-slate-500 dark:text-slate-400">
        <p>&copy; 2025 메이플스토리 전적검색. MapleStory API 활용</p>
    </footer>

    <script src="main.js" defer></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Dark mode toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            lucide.createIcons();
        });
        
        // Load saved theme
        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
        }
        
        // Check for system preference
        if (window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem('theme')) {
            html.classList.add('dark');
        }
        
        // Wait for API data to load before enabling button
        function checkApiKey() {
            const apiKey = localStorage.getItem("docSnap");
            const button = document.getElementById('fetchButton');
            const input = document.getElementById('x_SRCH');
            
            if (apiKey && JSON.parse(apiKey).api) {
                button.disabled = false;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                setTimeout(checkApiKey, 1000);
            }
        }
        
        checkApiKey();
    </script>
    <link rel="stylesheet" href="styles.css">
</body>
</html>
